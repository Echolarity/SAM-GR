# ============================================================
#  2018 Amazon (McAuley amazon_v2) 数据集下载配置
#  改完这个文件后运行:   bash nohup_run.sh
#  (或在项目根目录:  nohup_run.sh 会用下面脚本名)
# ============================================================

# ---- 要下载的类别 (空格分隔, 可一次下多个) ----
# 原版 MIMIGenRec 用的三个:
CATEGORIES="Industrial_and_Scientific Office_Products Toys_and_Games"
# 其它常用 (取消注释即可加进来):
# CATEGORIES="Industrial_and_Scientific Office_Products Toys_and_Games Sports_and_Outdoors All_Beauty"
# 可用类别名 (amazon_v2 官方):
#   Industrial_and_Scientific  Office_Products  Toys_and_Games
#   Sports_and_Outdoors  All_Beauty  Clothing_Shoes_and_Jewelry
#   Home_and_Kitchen  Electronics  Cell_Phones_and_Accessories
#   Musical_Instruments  Video_Games  Pet_Supplies  ...

# ---- k-core 筛选阈值 (原版 MIMIGenRec = 5) ----
USER_K=5
ITEM_K=5

# ---- 数据文件(评论/meta) 多连接下载数 (越大越快, 但别太夸张; 建议 16~32) ----
CONNS=32

# ---- 图片并发线程数 (太大易被 Amazon 限流, 建议 16~48) ----
WORKERS=32

# ---- 数据输出根目录 (每个类别一个子目录) ----
DATA_ROOT="data/amazon18"

# ---- 每类最多下载多少商品的图 (0 = 全部, 仅调试用) ----
MAX_ITEMS=0
